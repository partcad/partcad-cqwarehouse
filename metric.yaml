{% from 'macros.j2' import list_sizes, screw_params, nut_params, washer_params %}

{#-
  What these screws implement. Every one of them is a machine screw: it goes
  into a thread that is already there - a tapped hole, a nut - which is what
  //pub/std/metric/m calls a bolt. Its 'm<d>-bolt' mates the clearance and the
  tapped openings, and holds a stack ('multiConnect'): a washer and a nut on
  one bolt. Its 'm<d>-screw' is the other kind, a screw that cuts its own
  thread: it mates a pilot hole and a clearance hole and not a tapped one, and
  takes one part per port, so 'pc test' failed a screw with a washer and a nut
  on it as two parts connected to one port.

  'm<d>-bolt' exists in //pub/std/metric/m only for a PartCAD that reads its
  parametric interfaces (0.8.77 and later), so an older one is still told
  'm<d>-screw', which is all it has. The test is the one that package makes:
  "is defined" first, because a PartCAD that predates these variables has none
  of them, and the lower version, because a release is cut by bumping the
  version after the merge.
-#}
{%- set screw_interface = "bolt" if (partcad_version_major is defined and partcad_version_at_least("0.8.77")) else "screw" %}

