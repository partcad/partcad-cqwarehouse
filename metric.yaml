  1.4: "M1.4-0.3",
  1.6: "M1.6-0.35",
  2: "M2-0.4",
  2.5: "M2.5-0.45",
  3: "M3-0.5",
  3.5: "M3.5-0.6",
  4: "M4-0.7",
