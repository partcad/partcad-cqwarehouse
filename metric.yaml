render:
  svg:
    # The exact hidden-line projection rather than the polygonal default: the
    # drawings are checked in, which is what PartCAD's 'reproducible' is for,
    # and the polygonal one drops the circular edges of a solid of revolution -
    # a plain washer came out as its two silhouettes and nothing else.
    reproducible: true
  readme: README_metric.md
