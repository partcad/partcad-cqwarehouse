  6: "M6-1",
  8: "M8-1.25",
  10: "M10-1.5",
  12: "M12-1.75",
  14: "M14-2",
  16: "M16-2",
  18: "M18-2.5",
  20: "M20-2.5",
  22: "M22-2.5",
  24: "M24-3",
  27: "M27-3",
  30: "M30-3.5",
  33: "M33-3.5",
  36: "M36-4",
  39: "M39-4",
  42: "M42-4.5",
  45: "M45-4.5",
  48: "M48-5",
  52: "M52-5",
  56: "M56-5.5",
  60: "M60-5.5",
  64: "M64-6",
} -%}


